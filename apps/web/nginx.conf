server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 3m;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_read_timeout 60s; }
  location / { try_files $uri /index.html; }
}
